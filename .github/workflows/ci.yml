name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VAR_project_id: nhtsa-recall-pipeline

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan (read-only preview, never apply)
        working-directory: terraform
        run: terraform plan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax check on DAG
        run: python -m py_compile dags/nhtsa_ingestion.py

      - name: Install dbt
        run: pip install dbt-core==1.11.11 dbt-bigquery==1.12.0

      - name: Write dbt CI profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          nhtsa_recall_pipeline:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: nhtsa-recall-pipeline
                dataset: nhtsa_silver
                threads: 4
                location: us-central1
          EOF

      - name: dbt parse (compile/syntax check)
        working-directory: dbt/nhtsa_recall_pipeline
        run: dbt parse --target ci

      - name: dbt test
        working-directory: dbt/nhtsa_recall_pipeline
        run: dbt test --target ci